services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${GETFY_HTTP_PORT:-80}:80"
      - "${GETFY_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - getfy_env:/etc/getfy:ro
      - caddy_data:/data
      - caddy_config:/config

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: getfy_app:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      APP_ENV: ${GETFY_APP_ENV:-production}
      APP_DEBUG: ${GETFY_APP_DEBUG:-false}
      GETFY_APP_URL: ${GETFY_APP_URL:-http://localhost}
      GETFY_WEBHOOK_PUBLIC_URL: ${GETFY_WEBHOOK_PUBLIC_URL:-}
      PORT: "80"
      APP_INSTALLED: ${GETFY_APP_INSTALLED:-true}
      APP_AUTO_MIGRATE: ${GETFY_APP_AUTO_MIGRATE:-false}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-pgsql}
      DB_HOST: ${GETFY_DB_HOST:-postgres}
      DB_PORT: ${GETFY_DB_PORT:-5432}
      DB_DATABASE: ${GETFY_DB_DATABASE:-getfy}
      DB_USERNAME: ${GETFY_DB_USERNAME:-getfy}
      DB_PASSWORD: ${GETFY_DB_PASSWORD:-getfy}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      REDIS_PORT: ${GETFY_REDIS_PORT:-6379}
      CACHE_STORE: ${GETFY_CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${GETFY_SESSION_DRIVER:-file}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "true"
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
      API_INBOUND_WEBHOOKS_ASYNC: ${API_INBOUND_WEBHOOKS_ASYNC:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1/up')===false?1:0);\""]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 180s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${GETFY_DB_DATABASE:-getfy}
      POSTGRES_USER: ${GETFY_DB_USERNAME:-getfy}
      POSTGRES_PASSWORD: ${GETFY_DB_PASSWORD:-getfy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "redis-server"
      - "--maxmemory"
      - "${GETFY_REDIS_MAXMEMORY:-128mb}"
      - "--maxmemory-policy"
      - "${GETFY_REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  queue:
    image: getfy_app:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "sh"
      - "-lc"
      - "set -e; php artisan queue:work --queue=payments,webhooks-outbound,webhooks-inbound,webhooks,payouts,meta-tracking,utmify-tracking,metrics-tracking,uazapi,default --sleep=3 --tries=3 --timeout=0 --memory=${GETFY_QUEUE_WORKER_MEMORY:-128} --max-time=${GETFY_QUEUE_WORKER_MAX_TIME:-3600} --max-jobs=${GETFY_QUEUE_WORKER_MAX_JOBS:-1000} & Q=$$!; php artisan schedule:work & S=$$!; trap 'kill $$Q $$S 2>/dev/null || true' INT TERM; while kill -0 $$Q 2>/dev/null && kill -0 $$S 2>/dev/null; do sleep 5; done; kill $$Q $$S 2>/dev/null || true; wait $$Q 2>/dev/null || true; wait $$S 2>/dev/null || true; exit 1"
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      APP_ENV: ${GETFY_APP_ENV:-production}
      APP_DEBUG: ${GETFY_APP_DEBUG:-false}
      GETFY_APP_URL: ${GETFY_APP_URL:-http://localhost}
      GETFY_WEBHOOK_PUBLIC_URL: ${GETFY_WEBHOOK_PUBLIC_URL:-}
      APP_INSTALLED: ${GETFY_APP_INSTALLED:-true}
      APP_AUTO_MIGRATE: ${GETFY_APP_AUTO_MIGRATE:-false}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-pgsql}
      DB_HOST: ${GETFY_DB_HOST:-postgres}
      DB_PORT: ${GETFY_DB_PORT:-5432}
      DB_DATABASE: ${GETFY_DB_DATABASE:-getfy}
      DB_USERNAME: ${GETFY_DB_USERNAME:-getfy}
      DB_PASSWORD: ${GETFY_DB_PASSWORD:-getfy}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      REDIS_PORT: ${GETFY_REDIS_PORT:-6379}
      CACHE_STORE: ${GETFY_CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${GETFY_SESSION_DRIVER:-file}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
      API_INBOUND_WEBHOOKS_ASYNC: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  stacker-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: stacker_agent:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      STACKER_GATEWAY_ROOT: /gateway
      APP_URL: ${GETFY_APP_URL:-http://localhost}
      STACKER_API_URL: ${STACKER_API_URL:-https://api.stacker.builders}
      STACKER_AGENT_TOKEN: ${STACKER_AGENT_TOKEN:-}
      STACKER_RELEASE_SIGNING_KEY: ${STACKER_RELEASE_SIGNING_KEY:-}
    volumes:
      - .:/gateway
      - getfy_storage:/gateway/storage
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
    driver: local
  getfy_storage:
    driver: local
  getfy_env:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
