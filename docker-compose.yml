services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: getfy_app:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "${GETFY_HTTP_PORT:-80}:80"
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      APP_ENV: ${GETFY_APP_ENV:-production}
      APP_DEBUG: ${GETFY_APP_DEBUG:-false}
      GETFY_APP_URL: ${GETFY_APP_URL:-http://localhost}
      GETFY_WEBHOOK_PUBLIC_URL: ${GETFY_WEBHOOK_PUBLIC_URL:-}
      PORT: "80"
      APP_INSTALLED: ${GETFY_APP_INSTALLED:-true}
      APP_AUTO_MIGRATE: ${GETFY_APP_AUTO_MIGRATE:-false}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-pgsql}
      DB_HOST: ${GETFY_DB_HOST:-postgres}
      DB_PORT: ${GETFY_DB_PORT:-5432}
      DB_DATABASE: ${GETFY_DB_DATABASE:-getfy}
      DB_USERNAME: ${GETFY_DB_USERNAME:-getfy}
      DB_PASSWORD: ${GETFY_DB_PASSWORD:-getfy}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      REDIS_PORT: ${GETFY_REDIS_PORT:-6379}
      CACHE_STORE: ${GETFY_CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${GETFY_SESSION_DRIVER:-file}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "true"
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
      API_INBOUND_WEBHOOKS_ASYNC: ${API_INBOUND_WEBHOOKS_ASYNC:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${GETFY_DB_DATABASE:-getfy}
      POSTGRES_USER: ${GETFY_DB_USERNAME:-getfy}
      POSTGRES_PASSWORD: ${GETFY_DB_PASSWORD:-getfy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "redis-server"
      - "--maxmemory"
      - "${GETFY_REDIS_MAXMEMORY:-512mb}"
      - "--maxmemory-policy"
      - "${GETFY_REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  scheduler:
    image: getfy_app:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      APP_ENV: ${GETFY_APP_ENV:-production}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-pgsql}
      DB_HOST: ${GETFY_DB_HOST:-postgres}
      DB_PORT: ${GETFY_DB_PORT:-5432}
      DB_DATABASE: ${GETFY_DB_DATABASE:-getfy}
      DB_USERNAME: ${GETFY_DB_USERNAME:-getfy}
      DB_PASSWORD: ${GETFY_DB_PASSWORD:-getfy}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      REDIS_PORT: ${GETFY_REDIS_PORT:-6379}
      CACHE_STORE: ${GETFY_CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-payments:
    image: getfy_app:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=payments,default"
      - "--sleep=3"
      - "--tries=3"
      - "--timeout=120"
      - "--memory=${GETFY_QUEUE_WORKER_MEMORY:-256}"
      - "--max-time=${GETFY_QUEUE_WORKER_MAX_TIME:-3600}"
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-pgsql}
      DB_HOST: ${GETFY_DB_HOST:-postgres}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
    depends_on:
      redis:
        condition: service_healthy

  worker-webhooks-out:
    image: getfy_app:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=webhooks-outbound,webhooks"
      - "--sleep=2"
      - "--tries=3"
      - "--timeout=60"
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-pgsql}
      DB_HOST: ${GETFY_DB_HOST:-postgres}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
    depends_on:
      redis:
        condition: service_healthy

  worker-webhooks-in:
    image: getfy_app:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=webhooks-inbound"
      - "--sleep=1"
      - "--tries=3"
      - "--timeout=120"
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      API_INBOUND_WEBHOOKS_ASYNC: "true"
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
    depends_on:
      redis:
        condition: service_healthy

  worker-payouts:
    image: getfy_app:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=payouts"
      - "--sleep=3"
      - "--tries=3"
      - "--timeout=120"
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-pgsql}
      DB_HOST: ${GETFY_DB_HOST:-postgres}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
    depends_on:
      redis:
        condition: service_healthy

  worker-meta-tracking:
    image: getfy_app:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=meta-tracking"
      - "--sleep=1"
      - "--tries=8"
      - "--timeout=60"
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-pgsql}
      DB_HOST: ${GETFY_DB_HOST:-postgres}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
    depends_on:
      redis:
        condition: service_healthy

  worker-utmify-tracking:
    image: getfy_app:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=utmify-tracking,metrics-tracking"
      - "--sleep=1"
      - "--tries=10"
      - "--timeout=60"
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-pgsql}
      DB_HOST: ${GETFY_DB_HOST:-postgres}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
    depends_on:
      redis:
        condition: service_healthy

  worker-integrax-sms:
    image: getfy_app:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=integrax-sms"
      - "--sleep=1"
      - "--tries=5"
      - "--timeout=60"
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-pgsql}
      DB_HOST: ${GETFY_DB_HOST:-postgres}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
    depends_on:
      redis:
        condition: service_healthy

  worker-uazapi:
    image: getfy_app:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=uazapi"
      - "--sleep=1"
      - "--tries=3"
      - "--timeout=90"
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-pgsql}
      DB_HOST: ${GETFY_DB_HOST:-postgres}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
    depends_on:
      redis:
        condition: service_healthy

  stacker-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: stacker_agent:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      STACKER_GATEWAY_ROOT: /gateway
      APP_URL: ${GETFY_APP_URL:-http://localhost}
      STACKER_API_URL: ${STACKER_API_URL:-https://api.stacker.builders}
      STACKER_AGENT_TOKEN: ${STACKER_AGENT_TOKEN:-}
      STACKER_RELEASE_SIGNING_KEY: ${STACKER_RELEASE_SIGNING_KEY:-}
    volumes:
      - .:/gateway
      - getfy_storage:/gateway/storage
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
    driver: local
  getfy_storage:
    driver: local
  getfy_env:
    driver: local
